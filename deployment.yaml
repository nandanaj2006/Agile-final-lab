apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: disaster-portal
  template:
    metadata:
      labels:
        app: disaster-portal
    spec:
      containers:
      - name: disaster-portal
        image: nandana200621/disaster-portal:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: disaster-portal-service
spec:
  type: NodePort
  selector:
    app: disaster-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30010
