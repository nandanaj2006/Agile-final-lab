apiVersion: apps/v1
kind: Deployment
metadata:
  name: agile-final-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agile-final-lab
  template:
    metadata:
      labels:
        app: agile-final-lab
    spec:
      containers:
      - name: agile-final-lab
        image: nandana200621/agile-final-lab:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: disaster-portal-service
spec:
  type: NodePort
  selector:
    app: disaster-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30010
